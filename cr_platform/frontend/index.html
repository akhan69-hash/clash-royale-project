<!doctype html>

    <title>Royale IQ - Clash Royale Stats, Decks & Coaching</title>
    <!-- Real SEO/discoverability pass (2026-09-08): the site had zero meta
         description/OpenGraph tags before this -- meaning a link shared on
         Discord/Reddit/Twitter rendered as a bare URL with no preview card,
         and search engines had nothing but the bare <title> to go on. -->
    <meta name="description" content="Real-time Clash Royale stats, deck coaching, card analytics, and meta tracking -- built entirely from live-collected battles, not a static snapshot." />
    <link rel="canonical" href="https://royaleiq.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Royale IQ" />
    <meta property="og:title" content="Royale IQ - Clash Royale Stats, Decks & Coaching" />
    <meta property="og:description" content="Real-time Clash Royale stats, deck coaching, card analytics, and meta tracking -- built entirely from live-collected battles." />
    <meta property="og:url" content="https://royaleiq.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Royale IQ - Clash Royale Stats, Decks & Coaching" />
    <meta name="twitter:description" content="Real-time Clash Royale stats, deck coaching, card analytics, and meta tracking." />
    <!-- Google Search Console / Bing Webmaster site-ownership verification --
         paste the <meta> tag each service gives you here (their dashboards
         offer an "HTML tag" verification method as an alternative to a DNS
         record -- no DNS access needed for this route). Left empty
         deliberately: this has to be YOUR real verification code from YOUR
         Google/Microsoft account, not something I can generate. -->
    <!-- <meta name="google-site-verification" content="PASTE_YOUR_CODE_HERE" /> -->
    <!-- <meta name="msvalidate.01" content="PASTE_YOUR_CODE_HERE" /> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

         the closest free approximation to the game's own logo lettering. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
